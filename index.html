<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1829/1829586.png">
  
  <title>Palette Diary</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .subtitle {
      margin: 0 0 6px;
      color: #9ca3af;
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1;
      letter-spacing: -1px;
    }

    .icon {
      width: 86px;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 42px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 44px;
      background: #171717;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .upload-area {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      cursor: pointer;
      color: #a3a3a3;
    }

    .upload-emoji {
      padding: 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 42px;
    }

    .upload-title {
      margin: 0;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }

    .upload-desc {
      margin: 8px 0 0;
      font-size: 14px;
      color: #a3a3a3;
    }

    .palette-overlay {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 16px;
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(18px);
    }

    .palette-title {
      margin-bottom: 14px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.82);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .swatch-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .swatch {
      height: 54px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
    }

    .hex {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 22px;
    }

    .action-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 68px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.32);
    }

    .primary {
      background: #fff;
      color: #000;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .palette-list {
      margin-top: 24px;
      padding: 20px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.06);
    }

    .palette-list h2 {
      margin: 0 0 16px;
      color: #d4d4d4;
      font-size: 18px;
    }

    .empty-text {
      margin: 0;
      color: #737373;
      font-size: 14px;
    }

    .color-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 12px;
      border: 0;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      color: white;
      cursor: pointer;
    }

    .color-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .color-dot {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .color-text {
      text-align: left;
    }

    .color-hex {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
    }

    .color-rgb {
      margin-top: 4px;
      color: #9ca3af;
      font-size: 12px;
    }

    .copy-text {
      color: #a3a3a3;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font-weight: 700;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div>
        <p class="subtitle">Palette Diary</p>
        <h1>Palette Diary</h1>
      </div>
      <div class="icon">📔</div>
    </section>

    <section class="photo-card" id="photoCard">
      <label class="upload-area" id="uploadArea">
        <div class="upload-emoji">🖼️</div>
        <div>
          <p class="upload-title">Upload a Photo</p>
          <p class="upload-desc">Extract beautiful colors from your memories.</p>
        </div>
        <input type="file" accept="image/*" class="hidden file-input" />
      </label>
    </section>

    <section class="actions">
      <label class="action-button primary">
        📷 Upload
        <input type="file" accept="image/*" class="hidden file-input" />
      </label>
      <label class="action-button secondary">
        ⬆️ Change
        <input type="file" accept="image/*" class="hidden file-input" />
      </label>
    </section>

    <section class="palette-list">
      <h2>Extracted Palette</h2>
      <div id="paletteList">
        <p class="empty-text">Your extracted colors will appear here.</p>
      </div>
    </section>
  </main>

  <script>
    const photoCard = document.getElementById("photoCard");
    const paletteList = document.getElementById("paletteList");
    const fileInputs = document.querySelectorAll(".file-input");

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b]
        .map((x) => x.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function colorDistance(a, b) {
      return Math.sqrt(
        Math.pow(a.r - b.r, 2) +
        Math.pow(a.g - b.g, 2) +
        Math.pow(a.b - b.b, 2)
      );
    }

    function extractPalette(image, maxColors = 6) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const size = 180;

      canvas.width = size;
      canvas.height = size;

      const ratio = Math.min(size / image.width, size / image.height);
      const w = image.width * ratio;
      const h = image.height * ratio;
      const x = (size - w) / 2;
      const y = (size - h) / 2;

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(image, x, y, w, h);

      const data = ctx.getImageData(0, 0, size, size).data;
      const buckets = new Map();

      for (let i = 0; i < data.length; i += 16) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const a = data[i + 3];

        if (a < 128) continue;

        const key = `${Math.round(r / 24) * 24},${Math.round(g / 24) * 24},${Math.round(b / 24) * 24}`;
        const current = buckets.get(key) || { r: 0, g: 0, b: 0, count: 0 };

        current.r += r;
        current.g += g;
        current.b += b;
        current.count += 1;

        buckets.set(key, current);
      }

      const sorted = [...buckets.values()]
        .map((c) => ({
          r: Math.round(c.r / c.count),
          g: Math.round(c.g / c.count),
          b: Math.round(c.b / c.count),
          count: c.count,
        }))
        .sort((a, b) => b.count - a.count);

      const selected = [];

      for (const color of sorted) {
        if (selected.every((s) => colorDistance(s, color) > 45)) {
          selected.push({ ...color, hex: rgbToHex(color.r, color.g, color.b) });
        }

        if (selected.length >= maxColors) break;
      }

      return selected;
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => toast.remove(), 1200);
    }

    async function copyColor(hex) {
      try {
        await navigator.clipboard.writeText(hex);
        showToast(`Copied ${hex}`);
      } catch {
        showToast(hex);
      }
    }

    function renderPalette(colors) {
      paletteList.innerHTML = "";

      colors.forEach((color) => {
        const row = document.createElement("button");
        row.className = "color-row";
        row.onclick = () => copyColor(color.hex);

        row.innerHTML = `
          <div class="color-info">
            <div class="color-dot" style="background: ${color.hex}"></div>
            <div class="color-text">
              <div class="color-hex">${color.hex}</div>
              <div class="color-rgb">RGB ${color.r}, ${color.g}, ${color.b}</div>
            </div>
          </div>
          <span class="copy-text">Copy</span>
        `;

        paletteList.appendChild(row);
      });
    }

    function renderPhoto(result, colors) {
      photoCard.innerHTML = `
        <img src="${result}" alt="Preview" />
        <div class="palette-overlay">
          <div class="palette-title">✨ Palette Colors</div>
          <div class="palette-grid">
            ${colors.map((color) => `
              <button class="swatch-button" data-hex="${color.hex}">
                <div class="swatch" style="background: ${color.hex}"></div>
                <div class="hex">${color.hex}</div>
              </button>
            `).join("")}
          </div>
        </div>
      `;

      document.querySelectorAll(".swatch-button").forEach((button) => {
        button.addEventListener("click", () => copyColor(button.dataset.hex));
      });
    }

    function handleFile(file) {
      if (!file) return;

      const reader = new FileReader();

      reader.onload = (event) => {
        const result = event.target.result;
        const image = new Image();

        image.onload = () => {
          const colors = extractPalette(image, 6);
          renderPhoto(result, colors);
          renderPalette(colors);
        };

        image.src = result;
      };

      reader.readAsDataURL(file);
    }

    fileInputs.forEach((input) => {
      input.addEventListener("change", (event) => {
        handleFile(event.target.files[0]);
      });
    });
  </script>
</body>
</html>
